<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Earlybird × EmbeddingGemma 2 — Voice Watercolor Canvas</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      :root {
        --canvas-bg: #f6f1e5;
        --theme-accent: #0284c7;
        --hud-bg: rgba(15, 23, 42, 0.84);
        --hud-border: rgba(148, 163, 184, 0.24);
        --text-main: #f8fafc;
        --text-muted: #cbd5e1;
        --ghost-color: #94a3b8;
        --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;
        --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root,
      .zero-ui-stage {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--canvas-bg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Cold-press cotton watercolor paper background with subtle organic wash */
      .zero-ui-stage .tl-background {
        background-color: var(--canvas-bg) !important;
        background-image:
          radial-gradient(circle at 18% 22%, rgba(56, 189, 248, 0.08) 0%, transparent 48%),
          radial-gradient(circle at 82% 76%, rgba(251, 146, 60, 0.08) 0%, transparent 52%),
          radial-gradient(circle at 52% 48%, rgba(167, 139, 250, 0.06) 0%, transparent 58%) !important;
        transition: background-color 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Apply organic SVG watercolor bleed filter to shape geometry while keeping text crisp */
      .zero-ui-stage .tl-shape[data-shape-type="geo"] .tl-svg-container,
      .zero-ui-stage .tl-shape[data-shape-type="arrow"] .tl-svg-container,
      .zero-ui-stage .tl-shape[data-shape-type="note"] .tl-note__container {
        filter: url(#watercolor-bleed) drop-shadow(0 6px 14px rgba(15, 23, 42, 0.08));
      }

      /* Smooth opacity & transform transitions as shapes get painted in */
      .zero-ui-stage .tl-shape {
        transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Ensure zero tldraw chrome or watermarks clutter the pure canvas */
      .tl-watermark_SEE-LICENSE,
      .tlui-layout {
        display: none !important;
      }

      /* Wet Watercolor Brush Bloom Layer (100% click-through) */
      .watercolor-bloom-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
        z-index: 8000;
        overflow: hidden;
      }

      .watercolor-bloom {
        position: absolute;
        transform: translate(-50%, -50%) scale(0.15);
        border-radius: 47% 53% 61% 39% / 45% 58% 42% 55%;
        background: radial-gradient(
          ellipse at center,
          var(--bloom-color, rgba(56, 189, 248, 0.55)) 0%,
          var(--bloom-edge, rgba(139, 92, 246, 0.28)) 52%,
          transparent 76%
        );
        filter: url(#watercolor-splatter-filter) blur(4px);
        mix-blend-mode: multiply;
        animation: pigment-wash 1.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .zero-ui-stage[data-dark="true"] .watercolor-bloom {
        mix-blend-mode: screen;
      }

      .watercolor-ring {
        position: absolute;
        transform: translate(-50%, -50%) scale(0.2);
        border-radius: 54% 46% 42% 58% / 52% 44% 56% 48%;
        border: 3px solid var(--bloom-color, rgba(56, 189, 248, 0.65));
        filter: url(#watercolor-splatter-filter);
        opacity: 0.75;
        animation: pigment-ring 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes pigment-wash {
        0% {
          transform: translate(-50%, -50%) scale(0.12) rotate(-8deg);
          opacity: 0.88;
        }
        45% {
          transform: translate(-50%, -50%) scale(1.05) rotate(4deg);
          opacity: 0.68;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.38) rotate(11deg);
          opacity: 0;
        }
      }

      @keyframes pigment-ring {
        0% {
          transform: translate(-50%, -50%) scale(0.18) rotate(0deg);
          opacity: 0.85;
        }
        65% {
          transform: translate(-50%, -50%) scale(1.12) rotate(-6deg);
          opacity: 0.42;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.28) rotate(-10deg);
          opacity: 0;
        }
      }

      /* 100% click-through ambient voice HUD — zero buttons, zero pointer interception */
      .ambient-hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 24px;
        z-index: 9999;
        display: flex;
        justify-content: center;
        pointer-events: none;
        user-select: none;
        padding: 0 24px;
      }

      .ambient-pill {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 560px;
        max-width: 940px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--hud-bg);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid var(--hud-border);
        box-shadow:
          0 20px 50px rgba(15, 23, 42, 0.28),
          0 0 28px -8px var(--theme-accent);
        color: var(--text-main);
        transition:
          box-shadow 0.35s ease,
          border-color 0.35s ease;
      }

      .pulse-orb-wrap {
        position: relative;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .pulse-orb {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle, var(--theme-accent) 0%, transparent 72%);
        opacity: 0.45;
        transition: transform 0.08s linear;
        animation: breathe 2.6s ease-in-out infinite;
      }

      .pulse-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--theme-accent);
        box-shadow: 0 0 12px var(--theme-accent);
      }

      .eq-bars {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 18px;
        flex-shrink: 0;
      }

      .eq-bars i {
        display: block;
        width: 2.5px;
        border-radius: 2px;
        background: var(--theme-accent);
        opacity: 0.72;
        transition: height 0.08s ease;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.75;
        }
      }

      .transcript-stream {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .words-line {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .spoken-word {
        color: #f8fafc;
        transition: opacity 0.12s ease;
      }

      .spoken-word.high-conf {
        text-shadow: 0 0 14px rgba(56, 189, 248, 0.28);
      }

      .spoken-word.mid-conf {
        border-bottom: 1px dashed rgba(148, 163, 184, 0.45);
      }

      .ghost-word {
        color: var(--ghost-color);
        font-style: italic;
        font-weight: 400;
      }

      .speculative-line {
        font: 11px var(--mono);
        color: #38bdf8;
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.95;
      }

      .spec-label {
        font-size: 9.5px;
        letter-spacing: 0.08em;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(56, 189, 248, 0.18);
        border: 1px solid rgba(56, 189, 248, 0.35);
      }

      .executed-line {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
      }

      .exec-tag {
        font: 600 10px var(--mono);
        letter-spacing: 0.08em;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.18);
        color: #34d399;
        border: 1px solid rgba(52, 211, 153, 0.35);
      }

      .exec-summary {
        color: #f1f5f9;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .exec-meta {
        font: 11px var(--mono);
        color: var(--text-muted);
        margin-left: auto;
      }

      .idle-prompt {
        font-size: 13.5px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .idle-prompt em {
        color: #ffffff;
        font-style: normal;
        font-family: var(--mono);
        font-size: 12px;
      }

      .model-telemetry {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 14px;
        border-left: 1px solid rgba(148, 163, 184, 0.22);
        font: 11px var(--mono);
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .theme-chip {
        color: #38bdf8;
        font-weight: 600;
      }

      .engine-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f59e0b;
      }

      .engine-dot.gpu-ready {
        background: #34d399;
        box-shadow: 0 0 8px #34d399;
      }

      .engine-label {
        font-size: 10.5px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <!-- SVG Filters for Real-Time Watercolor Pigment Edge Diffusion & Wet Splatter Blooms -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none" aria-hidden="true">
      <defs>
        <filter id="watercolor-bleed" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="11" result="paperNoise" />
          <feDisplacementMap in="SourceGraphic" in2="paperNoise" scale="4.2" xChannelSelector="R" yChannelSelector="G" result="roughened" />
          <feGaussianBlur in="roughened" stdDeviation="0.65" result="softBleed" />
          <feMerge>
            <feMergeNode in="softBleed" />
            <feMergeNode in="roughened" />
          </feMerge>
        </filter>
        <filter id="watercolor-splatter-filter" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7" result="splatNoise" />
          <feDisplacementMap in="SourceGraphic" in2="splatNoise" scale="22" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
