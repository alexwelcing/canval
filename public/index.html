<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Earlybird × EmbeddingGemma 2 — Zero-UI Voice Canvas</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      :root {
        --canvas-bg: #08101d;
        --theme-accent: #38bdf8;
        --hud-bg: rgba(9, 14, 26, 0.76);
        --hud-border: rgba(148, 163, 184, 0.18);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --ghost-color: #64748b;
        --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;
        --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root,
      .zero-ui-stage {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--canvas-bg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Apply custom theme canvas surface while keeping tldraw interactive */
      .zero-ui-stage .tl-background {
        background-color: var(--canvas-bg) !important;
        transition: background-color 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Ensure zero tldraw chrome or watermarks clutter the pure canvas */
      .tl-watermark_SEE-LICENSE,
      .tlui-layout {
        display: none !important;
      }

      /* 100% click-through ambient voice HUD — zero buttons, zero pointer interception */
      .ambient-hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 28px;
        z-index: 9999;
        display: flex;
        justify-content: center;
        pointer-events: none;
        user-select: none;
        padding: 0 24px;
      }

      .ambient-pill {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 540px;
        max-width: 920px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--hud-bg);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid var(--hud-border);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.45),
          0 0 28px -8px var(--theme-accent);
        color: var(--text-main);
        transition:
          box-shadow 0.35s ease,
          border-color 0.35s ease;
      }

      .pulse-orb-wrap {
        position: relative;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .pulse-orb {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle, var(--theme-accent) 0%, transparent 72%);
        opacity: 0.45;
        transition: transform 0.08s linear;
        animation: breathe 2.6s ease-in-out infinite;
      }

      .pulse-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--theme-accent);
        box-shadow: 0 0 12px var(--theme-accent);
      }

      .eq-bars {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 18px;
        flex-shrink: 0;
      }

      .eq-bars i {
        display: block;
        width: 2.5px;
        border-radius: 2px;
        background: var(--theme-accent);
        opacity: 0.72;
        transition: height 0.08s ease;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.75;
        }
      }

      .transcript-stream {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .words-line {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .spoken-word {
        color: #f8fafc;
        transition: opacity 0.12s ease;
      }

      .spoken-word.high-conf {
        text-shadow: 0 0 14px rgba(56, 189, 248, 0.28);
      }

      .spoken-word.mid-conf {
        border-bottom: 1px dashed rgba(148, 163, 184, 0.45);
      }

      .ghost-word {
        color: var(--ghost-color);
        font-style: italic;
        font-weight: 400;
      }

      .speculative-line {
        font: 11px var(--mono);
        color: var(--theme-accent);
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.9;
      }

      .spec-label {
        font-size: 9.5px;
        letter-spacing: 0.08em;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(56, 189, 248, 0.14);
        border: 1px solid rgba(56, 189, 248, 0.3);
      }

      .executed-line {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
      }

      .exec-tag {
        font: 600 10px var(--mono);
        letter-spacing: 0.08em;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.15);
        color: #34d399;
        border: 1px solid rgba(52, 211, 153, 0.32);
      }

      .exec-summary {
        color: #f1f5f9;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .exec-meta {
        font: 11px var(--mono);
        color: var(--text-muted);
        margin-left: auto;
      }

      .idle-prompt {
        font-size: 13.5px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .idle-prompt em {
        color: #e2e8f0;
        font-style: normal;
        font-family: var(--mono);
        font-size: 12px;
      }

      .model-telemetry {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 14px;
        border-left: 1px solid rgba(148, 163, 184, 0.16);
        font: 11px var(--mono);
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .theme-chip {
        color: var(--theme-accent);
        font-weight: 600;
      }

      .engine-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f59e0b;
      }

      .engine-dot.gpu-ready {
        background: #34d399;
        box-shadow: 0 0 8px #34d399;
      }

      .engine-label {
        font-size: 10.5px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
